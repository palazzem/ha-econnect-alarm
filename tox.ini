[tox]
envlist =
    lint
    typing
    python3.14

[testenv]
allowlist_externals = pytest
deps =
    -e .[dev]
commands =
    pytest tests --cov --cov-branch --cov-report=xml -vv

[testenv:typing]
# mypy checks the integration against the types of the Home Assistant it installs.
deps = mypy==2.4.1
commands =
    mypy

[testenv:lint]
skip_install = true
deps = pre-commit==4.7.0
commands = pre-commit run --all-files
