[build-system]
requires = [
  "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "econnect-metronet"
dynamic = ["version"]
description = "Home Assistant integration that provides a full-fledged Alarm Panel to control your Elmo/IESS alarm systems."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = [
  "python",
  "home-automation",
  "home-assistant",
  "alarm-system",
  "econnect",
  "elmo",
  "metronet",
  "iess",
]
authors = [
  { name = "Emanuele Palazzetti", email = "emanuele.palazzetti@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "async_timeout",
  "homeassistant",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pre-commit",
  # Test
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-mock",
  "responses",
  "tox",
  # Home Assistant fixtures, released with the matching Home Assistant version
  "pytest-homeassistant",
]

[project.urls]
Documentation = "https://github.com/palazzem/ha-econnect-alarm#readme"
Issues = "https://github.com/palazzem/ha-econnect-alarm/issues"
Source = "https://github.com/palazzem/ha-econnect-alarm"

[tool.hatch.version]
path = "custom_components/econnect_metronet/manifest.json"
pattern = '"version":\s"(?P<version>[^"]+)"'

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["B", "D", "E", "I", "S", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest asserts with `assert`.
"tests/**" = ["S101"]
# A test's name states what it checks. The scenario runner's modules are a public API and keep their docstrings.
"tests/**/test_*.py" = ["D"]
"tests/__init__.py" = ["D"]
"tests/conftest.py" = ["D"]
"tests/helpers.py" = ["D"]
"tests/api/**" = ["D"]
"tests/fixtures/**" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"

[tool.hatch.build.targets.sdist]
only-include = ["custom_components/econnect_metronet"]

[tool.coverage.run]
omit = [
  "tests/*",
]

[tool.mypy]
files = ["custom_components", "tests/scenarios/runner"]
strict = true
